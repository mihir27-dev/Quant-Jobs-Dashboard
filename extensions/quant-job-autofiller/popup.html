<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 15px; margin: 0; }
    h3 { margin-top: 0; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
    button:hover { background: #4338ca; }
    button.secondary { background: #e5e7eb; color: #374151; }
    button.secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <h3>Quant Auto-Filler</h3>
  <div id="setup">
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <input type="email" id="email" placeholder="Email">
    <input type="tel" id="phone" placeholder="Phone">
    <input type="url" id="linkedin" placeholder="LinkedIn URL">
    <button id="saveBtn">Save Profile</button>
  </div>
  <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;" />
  <button id="autofillBtn">Auto-Fill Current Page</button>
  <script src="popup.js"></script>
</body>
</html>
